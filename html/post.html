<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Producto | Marketplace Unison</title>
    <link rel="stylesheet" href="../css/styleMain.css">
    <style>
        .contenedor-form {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-grupo {
            margin-bottom: 20px;
        }
        .form-grupo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .form-grupo input, .form-grupo select, .form-grupo textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-grupo textarea {
            resize: vertical;
            min-height: 100px;
        }
        .btn-submit {
            width: 100%;
            background-color: #0084ff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #006bce;
        }
        /* Zona para previsualizar la foto */
        .preview-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
            display: none; /* Se oculta hasta que elijan una foto */
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="cabecera">
            <h4 onclick="window.location.href='main.html'" style="cursor: pointer; margin:0; color:#0084ff;">⬅ Volver al MarketPlace</h4>
        </div>
    </header>

    <main class="contenedor-form">
        <h2>Vender un artículo</h2>
        <p style="color: #666; margin-bottom: 25px;">Llena los datos para que todos en la Unison vean tu producto.</p>
        <form id="formPublicar" enctype="multipart/form-data">

            <div class="form-grupo">
                <label for="titulo">¿Qué vendes?</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej. Lápiz táctil para iPad" required>
            </div>

            <div class="form-grupo">
                <label for="precio">Precio ($)</label>
                <input type="number" id="precio" name="precio" placeholder="Ej. 500" step="0.01" required>
            </div>

            <div class="form-grupo">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecciona una opción...</option>
                    <option value="Electrónica">Electrónica</option>
                    <option value="Accesorios">Accesorio</option>
                    <option value="Comida">Comida</option>
                    <option value="Hogar">Hogar</option>
                    <option value="Papelería">Papeleria</option>
                    <option value="Deportivo">Deportivo</option>
                    <option value="Musica">Musica</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="descripcion">Descripción (opcional)</label>
                <textarea id="descripcion" name="descripcion" placeholder="Agrega detalles como estado, entregas, etc."></textarea>
            </div>

            <div class="form-grupo">
                <label for="imagen">Foto del producto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
                <img id="preview" class="preview-img" alt="Vista previa">
            </div>

            <button type="submit" class="btn-submit">Publicar Producto</button>
            <div id="mensaje-respuesta" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
        </form>
    </main>

    <script src="../javascript/post.js"></script>
</body>
</html>
