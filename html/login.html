<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styleLogin.css">
    <title>Login</title>

</head>

<body>
<div class="contenedor">

    <form class="login" action="#" id="form-login" >
        <img src="../marketplace_unison.png" alt="[Imagen]">

        <h2>Iniciar sesión</h2>

        <input type="email" id="correo" placeholder="Correo Institucional" aria-label="correo" required>

        <input type="password" id="contra" placeholder="Contraseña" aria-label="contra" required>

        <button type="submit">Entrar</button>
        <a href="accountRecovery.html" class="boton">¿Perdiste tu contaseña?</a>
        <a href="newAccount.html" class="boton">¿No tienes una cuenta?</a>

        <div id="mensaje-error" style="color: red; margin-top: 10px;"></div>

    </form>
</div>

<script src="../javascript/login.js"></script>

</body>
</html>
