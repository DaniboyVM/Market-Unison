<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/styleLogin.css">
  <title>Registro</title>

</head>
<body>
    <div class="contenedor">
    <form class="login" action="#" >

      <h2>Registro</h2>

        <input type="text" id="nombre" placeholder="Nombre" aria-label="nombre" required>
        <input type="text" id="correo" placeholder="Correo Institucional" aria-label="correo" required>
        <input type="password" id="contra1" placeholder="Contraseña" aria-label="contra" required>
        <input type="password" id="contra2" placeholder="Repita la contraseña" aria-label="contra2" required>

        <button type="submit" >Registrarse</button>
        <a href="login.html" class="boton">Ya tengo una cuenta</a>

    </form>
    </div>

</body>

</html>
